name: Blog automático

on:
  schedule:
    # Todos los lunes a las 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Días a revisar si todavía no hay estado previo (vacío = 30)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: blog-automatico
  cancel-in-progress: false

jobs:
  publicar:
    name: Generar y publicar el resumen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el sitio publicado
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar las entradas del blog
        env:
          # Un PAT con acceso de lectura a los repositorios del proyecto.
          # Si no existe, se usa el token del propio workflow: sirve mientras
          # los repositorios sean públicos.
          BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN || github.token }}
          DAYS: ${{ inputs.days }}
        run: |
          args=()
          if [ -n "${DAYS:-}" ]; then
            args+=(--days "$DAYS")
          fi
          node blog/automation/generate.mjs "${args[@]}"

      - name: Publicar los cambios
        run: |
          if [ -z "$(git status --porcelain -- blog en/blog)" ]; then
            echo "Sin novedades: no hay nada que publicar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog en/blog
          git commit -m "chore(blog): publica el resumen automático de los repositorios"
          git push
