<!DOCTYPE html>

    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=/">
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/web(?=\/|$)/, "");

        window.location.replace(path + window.location.search + window.location.hash);
      })();
    </script>
  </head>
